# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Erfan Taatizadeh"
title_separator          : "-"
name                     : &name "Erfan Taatizadeh"
description              : &description "Postdoctoral Scholar at UC Davis building physics-informed neural networks and neural operators for patient-specific blood flow and liver cancer therapy planning."
url                      : https://erfan-taatizadeh.github.io
baseurl                  : ""
repository               : "erfan-taatizadeh/erfan-taatizadeh.github.io"

