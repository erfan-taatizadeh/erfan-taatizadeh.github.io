<div class="social">
  <a href="mailto:{{ site.author.email }}" aria-label="Email"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>
  {%- if site.author.googlescholar %}<a href="{{ site.author.googlescholar }}" aria-label="Google Scholar" rel="me noopener" target="_blank"><i class="ai ai-google-scholar" aria-hidden="true"></i></a>{% endif %}
  {%- if site.author.github %}<a href="https://github.com/{{ site.author.github }}" aria-label="GitHub" rel="me noopener" target="_blank"><i class="fa-brands fa-github" aria-hidden="true"></i></a>{% endif %}
  {%- if site.author.linkedin %}<a href="https://www.linkedin.com/in/{{ site.author.linkedin }}" aria-label="LinkedIn" rel="me noopener" target="_blank"><i class="fa-brands fa-linkedin-in" aria-hidden="true"></i></a>{% endif %}
  {%- if site.author.orcid %}<a href="{{ site.author.orcid }}" aria-label="ORCID" rel="me noopener" target="_blank"><i class="ai ai-orcid" aria-hidden="true"></i></a>{% endif %}
</div>
